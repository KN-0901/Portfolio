<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">NOVA</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-hero">
        <h2>LET ME TELL YOUR DIGITAL STORIES</h2>
        
        <div class="form-box">
            <form id="contact-form" action="#" method="POST">
                <div class="form-group">
                    <label>FIRST NAME</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>LAST NAME</label>
                    <input type="text" id="lname" required>
                </div>
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" required>
                </div>
                <div style="display: flex; justify-content: flex-end; width: 100%; margin-top: 2rem;">
                    <button type="submit" class="btn" style="border: none; cursor: pointer;">Submit</button>
                </div>
            </form>
        </div>

        <footer>
            <ul class="social-icons">
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
                <li><a href="#">Twitter</a></li>
            </ul>
        </footer>
    </main>
